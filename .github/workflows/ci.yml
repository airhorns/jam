name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm typecheck
      - name: Package unit tests, failing under 90% coverage
        run: corepack pnpm test:coverage
      - run: corepack pnpm test:examples
      - run: corepack pnpm --dir examples/folk-todo exec playwright install --with-deps chromium
      - run: corepack pnpm --dir examples/puddy-vite exec playwright install --with-deps chromium
      - run: corepack pnpm --dir examples/linearlite exec playwright install --with-deps chromium
      - run: corepack pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: |
            examples/folk-todo/test-results
            examples/puddy-vite/test-results
            examples/linearlite/test-results
            examples/catalog/test-results
          if-no-files-found: ignore
          retention-days: 7

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain pinned in crates/rust-toolchain.toml
        working-directory: crates
        run: |
          rustup toolchain install
          rustup component add llvm-tools-preview
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-llvm-cov@0.9.0,wasm-bindgen-cli@0.2.127
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack pnpm rust:fmt
      - run: corepack pnpm rust:clippy
      - run: corepack pnpm rust:deny
      - run: corepack pnpm rust:no-ignored-tests
      - run: corepack pnpm rust:test
      - run: corepack pnpm rust:coverage
      - name: Committed WASM build matches the Rust source
        run: |
          corepack pnpm build:engine
          git diff --exit-code --stat -- packages/engine/pkg

  engine-benchmarks:
    name: Engine Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain pinned in crates/rust-toolchain.toml
        working-directory: crates
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
          key: bench
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack pnpm rust:bench
      - name: Upload engine benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: jam-engine-benchmarks
          path: crates/target/criterion/**/new/*.json
          if-no-files-found: error

  core-benchmarks:
    name: Core Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack pnpm install --frozen-lockfile
      - name: Run core benchmarks
        run: corepack pnpm --dir packages/core run bench:ci
      - name: Upload core benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: jam-core-benchmarks
          path: packages/core/benchmark-results/core-benchmarks.json
          if-no-files-found: error
