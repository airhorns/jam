name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm typecheck
      - run: corepack pnpm test:ui
      - run: corepack pnpm test
      - run: corepack pnpm --dir examples/folk-todo exec playwright install --with-deps chromium
      - run: corepack pnpm --dir examples/puddy-vite exec playwright install --with-deps chromium
      - run: corepack pnpm --dir examples/linearlite exec playwright install --with-deps chromium
      - run: corepack pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: |
            examples/folk-todo/test-results
            examples/puddy-vite/test-results
            examples/linearlite/test-results
            examples/catalog/test-results
          if-no-files-found: ignore
          retention-days: 7

  linearlite-electric:
    name: LinearLite on Electric
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: examples/linearlite

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack pnpm install --frozen-lockfile
        working-directory: .
      - run: corepack pnpm exec playwright install --with-deps chromium
      - name: Start Postgres and Electric
        run: corepack pnpm backend:up
        env:
          ISSUES_TO_LOAD: "100"
      - name: Start the sync server
        run: |
          corepack pnpm sync-server > sync-server.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://localhost:3001 > /dev/null && exit 0; sleep 1; done
          cat sync-server.log; exit 1
      - run: corepack pnpm test:e2e:electric
      - name: Backend logs
        if: failure()
        run: |
          cat sync-server.log
          corepack pnpm backend:logs electric
          corepack pnpm backend:logs postgres
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linearlite-electric-test-results
          path: examples/linearlite/test-results
          if-no-files-found: ignore
          retention-days: 7

  core-benchmarks:
    name: Core Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack pnpm install --frozen-lockfile
      - name: Run core benchmarks
        run: corepack pnpm --dir packages/core run bench:ci
      - name: Upload core benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: jam-core-benchmarks
          path: packages/core/benchmark-results/core-benchmarks.json
          if-no-files-found: error
