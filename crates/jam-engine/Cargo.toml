[package]
name = "jam-engine"
description = "Incremental fact store: interned tuples, self-tuning indexes, incrementally maintained conjunctive queries, ownership-based retraction"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hashbrown = { version = "0.15", default-features = false, features = ["default-hasher", "inline-more"] }
indexmap = "2"
smallvec = { version = "1", features = ["union", "const_generics"] }

[dev-dependencies]
