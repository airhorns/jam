[package]
name = "jam-engine"
description = "Incremental fact store: interned tuples, self-tuning indexes, incrementally maintained conjunctive queries, ownership-based retraction"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
hashbrown = { version = "0.17", default-features = false, features = ["default-hasher", "inline-more"] }
indexmap = "2"
smallvec = { version = "1", features = ["union", "const_generics"] }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
pretty_assertions = "1"

[[bench]]
name = "engine"
harness = false
