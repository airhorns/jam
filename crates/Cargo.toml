[workspace]
resolver = "3"
members = ["jam-engine", "jam-engine-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.96.0"

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
ignore_without_reason = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
wildcard_dependencies = "deny"

[workspace.lints.clippy.all]
level = "deny"
priority = -1

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
